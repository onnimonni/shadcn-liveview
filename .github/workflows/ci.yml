name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every job runs inside the repository's devenv shell, so CI uses exactly the
# Elixir/Erlang/Bun/Node toolchain (and, on Linux, the Nix Chromium Playwright
# uses) that devenv.nix and devenv.lock pin for local development.
jobs:
  test:
    name: Generate, quality, tools, ExUnit, SSR parity
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Library pipeline (bun run test)
        run: devenv shell -- env -u PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH bun run test
      - name: Generated files are committed
        run: git diff --exit-code -- lib usage-rules priv/static/shadcn.css priv/static/shadcn.tailwind.css priv/static/shadcn-hooks.js
      - name: Consumer example tests
        run: devenv shell -- env -u PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH bash -c 'cd examples/consumer && export MIX_BUILD_ROOT="$PWD/_build" && mix compile --warnings-as-errors && mix assets.build && mix test'

  browser:
    name: Connected browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Browser suites (ExUnit + consumer + Playwright incl. console errors)
        run: devenv shell -- env -u PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH bun run test:browser
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
